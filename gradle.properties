# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# 构建用 JDK：Android Studio 自带的 JBR 是 JDK 25，而 Gradle 8.9 仅支持到 JDK 22，
# 直接 sync 会报 "Unsupported Java runtime"。这里固定指向本机已解压的 Temurin JDK 21。
# 若你在 AS 里已把 Gradle JDK 设为 17/21，或系统默认 JDK 已是 17-22，可删掉此行。
org.gradle.java.home=D:/claude/tools/jdk21/jdk-21.0.12.1+1

